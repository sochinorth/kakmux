# tmux for kakbr (shell/kakmux.zsh): a private server per kakbr (tmux -L kakbr-PID)
# holding a broot sidebar beside a kakmux (see kakbr), so kakbr is one
# opaque pane wherever it runs, and kak's splits and bufferline stay in the
# kak half. tmux itself shows nothing: no status line, no prefix key.

set -g status off
set -g prefix None

set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g focus-events on   # passed on to kak (auto-save, inactive status lines)
set -s escape-time 0     # no lag on <esc>
set -s extended-keys on  # pass modified keys like <c-right>/<s-right> through
set -g mouse on          # click to focus, drag the border to resize

# The broot sidebar's width: 25% of the window, within 24..40 columns, kak
# gets the rest. When the window resizes (the terminal does), the hook sets it
# again before anything is drawn, where tmux would rescale it (not while it
# floats: kakbr-sidebar sizes it again once it's docked). kakbr-sidebar
# (which records the pane, @kakbr_side) sets it once kak's pane is beside it,
# and snaps it into 24..40 when it's resized by hand.
set -g @kakbr_percent 25
set -g @kakbr_min 24
set -g @kakbr_max 40
set -g @kakbr_width '#{?#{e|<:#{e|/:#{e|*:#{window_width},#{@kakbr_percent}},100},#{@kakbr_min}},#{@kakbr_min},#{?#{e|>:#{e|/:#{e|*:#{window_width},#{@kakbr_percent}},100},#{@kakbr_max}},#{@kakbr_max},#{e|/:#{e|*:#{window_width},#{@kakbr_percent}},100}}}'
set-hook -g window-resized "if -F '#{&&:#{@kakbr_side},#{!:#{@kakbr_float}}}' \"run-shell -C 'resize-pane -t #{@kakbr_side} -x #{E:@kakbr_width}'\""

# In broot, <c-w> then l, → or w moves to kak, as in kak's window mode (whose
# <c-w> h comes back), z floats broot over kak (or docks it back), and q
# quits kakbr; any other key cancels. Anywhere else <c-w> goes through
# untouched. The keys are window-keys' (beside this), which shows their
# legend and reads one, in a popup: kak's info box for its own <c-w>, in its
# colours (Information), at the bottom right of broot's pane, above its two
# last lines. -w/-h fit the legend (24 columns: broot's least); floated, it's
# two lines (window-keys), and -w/-h take no formats, hence two popups.
bind -n C-w if -F '#{@kakbr_sidebar}' {
	if -F '#{@kakbr_float}' {
		display-popup -E -b rounded -T '#[align=centre]window' \
			-s 'fg=#ABB2BF,bg=#2C323C' -S 'fg=#ABB2BF,bg=#2C323C' -w 16 -h 4 \
			-x '#{popup_pane_right}' -y '#{e|-:#{popup_pane_bottom},2}' \
			'exec "${XDG_CONFIG_HOME:-$HOME/.config}/kakbr/window-keys"'
	} {
		display-popup -E -b rounded -T '#[align=centre]window' \
			-s 'fg=#ABB2BF,bg=#2C323C' -S 'fg=#ABB2BF,bg=#2C323C' -w 24 -h 6 \
			-x '#{popup_pane_right}' -y '#{e|-:#{popup_pane_bottom},2}' \
			'exec "${XDG_CONFIG_HOME:-$HOME/.config}/kakbr/window-keys"'
	}
} { send-keys C-w }

# Floated broot (float, beside this: a floating pane, @kakbr_float on the
# window) is titled on its border; <esc> there docks it once broot has
# nothing left to do with it: no filter to clear, no state to go back to
# (float esc). Docked, and in kak, <esc> goes through untouched. Focus
# leaving it (a click on kak) docks it too: after-select-pane, below.
set -g pane-border-status top-floating
set -g pane-border-format '#[align=centre] broot '
bind -n Escape if -F '#{&&:#{@kakbr_sidebar},#{@kakbr_float}}' {
	run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/kakbr/float" esc "#{pane_id}"'
} { send-keys Escape }

# broot's git marks: its watch (kakbr-sidebar) misses changes to .git alone
# (a commit, git add), so it refreshes (:refresh, as F5) as the focus moves
# between broot and kak (select-pane: keys, clicks, kakrc's explorer), or
# comes back to kakbr's terminal (a commit made elsewhere), through its
# server (@kakbr_broot). A few ms, in the background. (pane-focus-in would
# do for the terminal, but not for kak's pane, a client of kakmux's tmux.)
set-hook -g client-focus-in {
	if -F '#{@kakbr_broot}' { run-shell -b 'broot --send "#{@kakbr_broot}" -c :refresh >/dev/null 2>&1 || :' }
}
set-hook -g after-select-pane {
	if -F '#{@kakbr_broot}' { run-shell -b 'broot --send "#{@kakbr_broot}" -c :refresh >/dev/null 2>&1 || :' }
	if -F '#{&&:#{@kakbr_float},#{!:#{@kakbr_sidebar}}}' { run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/kakbr/float" dock "#{@kakbr_side}"; tmux select-pane -t "#{pane_id}"' }
}
