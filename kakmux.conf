# tmux for kakmux (~/.local/bin/kakmux): a private server per kakmux
# (tmux -L kakmux-PID) whose status line is kak's bufferline. kakrc turns the
# status line on once there are 2+ buffers.

set -g status off
set -g status-position top
set -g status-style 'fg=#5C6370,bg=#2C323C'   # until kakrc sets it from the colour scheme
set -g status-left-length 1000
set -g status-left '#{@kak_bufferline}'
set -g status-right ''
set -g window-status-format ''
set -g window-status-current-format ''

set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g focus-events on   # kakrc's FocusIn/FocusOut hooks (bufferline, autosave)
set -s escape-time 0     # no lag on <esc>
set -s extended-keys on  # pass modified keys like <c-right>/<s-right> through
set -g mouse on

# Helix-style even splits (bin/kakmux-even): opening or closing one evens out
# the row/column it's in and nothing else; split members scale as a whole,
# keeping their own proportions. For closes it needs to know where the pane
# was, hence the last two layouts kept per window.
set-hook -g window-layout-changed 'set -Fw @kakmux_prev "#{@kakmux_cur}" ; set -Fw @kakmux_cur "#{window_layout}"'
set-hook -g after-split-window    'run-shell -b "~/.config/kak/bin/kakmux-even #{socket_path} #{window_id} split #{pane_id}"'
set-hook -g pane-exited           'run-shell -b "~/.config/kak/bin/kakmux-even #{socket_path} #{window_id} close"'
set-hook -g after-kill-pane       'run-shell -b "~/.config/kak/bin/kakmux-even #{socket_path} #{window_id} close"'
